# Đặt file này tại: .github/workflows/deploy.yml
# Mỗi lần push lên nhánh main: build trên GitHub rồi tự upload lên host cPanel.
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          tools: composer:v2

      - name: Cài thư viện PHP (bản chạy thật, không có dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build giao diện Vue
        run: |
          npm ci
          npm run build

      - name: Upload lên host qua FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Thư mục gốc dự án trên host, tính từ thư mục mà tài khoản FTP đăng nhập vào
          server-dir: /
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            tests/**
            .env
            .env.*
            public/hot

      # Tự chạy migrate trên host sau khi upload xong.
      # Cần: secret DEPLOY_TOKEN + APP_URL trên GitHub, và DEPLOY_TOKEN (cùng giá trị) trong .env trên host.
      # Chưa khai báo DEPLOY_TOKEN thì bước này tự bỏ qua.
      - name: Chạy migrate trên host
        env:
          DT: ${{ secrets.DEPLOY_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        if: ${{ env.DT != '' && env.APP_URL != '' }}
        run: |
          sleep 5
          curl -fsS --retry 3 --retry-delay 5 -X POST "${APP_URL%/}/api/he-thong/cap-nhat" \
            -H "X-Deploy-Token: $DT" -H "Accept: application/json"
